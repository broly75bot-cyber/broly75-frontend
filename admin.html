<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BROLY75 — Administration</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
 
  <style>
  :root{ --ink:#0B0B0D; --paper:#F1EFE9; --lime:#D4FF3D; --pink:#FF2E88; --line:rgba(241,239,233,0.14); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--ink); color:var(--paper); font-family:'Space Grotesk', sans-serif; padding:20px 16px 60px; }
  h1{ font-family:'Anton', sans-serif; font-size:26px; text-transform:uppercase; margin-bottom:16px; }
  h2{ font-family:'Space Grotesk', sans-serif; font-size:16px; margin-bottom:12px; }
  input, textarea, select{
    width:100%; padding:11px; border-radius:10px; border:2px solid var(--line);
    background:#151417; color:var(--paper); font-family:'Space Grotesk', sans-serif; margin-bottom:10px; font-size:14px;
  }
  label{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; color:var(--lime); display:block; margin-bottom:5px; }
  button{
    background:var(--lime); color:var(--ink); border:none; padding:11px 18px;
    border-radius:22px; font-weight:700; font-family:'Space Grotesk', sans-serif; cursor:pointer; font-size:13px;
  }
  button.secondary{ background:none; border:2px solid var(--line); color:var(--paper); }
  button.danger{ background:var(--pink); color:#fff; }

  .login-box{ max-width:340px; margin:80px auto; text-align:center; }
  #app{ display:none; max-width:640px; margin:0 auto; }

  .tabs{ display:flex; gap:8px; margin-bottom:20px; overflow-x:auto; }
  .tab-btn{
    background:#151417; border:2px solid var(--line); color:var(--paper);
    padding:9px 16px; border-radius:20px; font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; white-space:nowrap;
  }
  .tab-btn.active{ background:var(--lime); color:var(--ink); border-color:var(--lime); }.top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.logout-btn{ background:none; border:2px solid var(--pink); color:var(--pink); padding:7px 14px; border-radius:18px; font-size:11px; font-family:'IBM Plex Mono', monospace; }
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.stat-card{ background:#151417; border:2px solid var(--line); border-radius:14px; padding:14px; }
.stat-card .stat-value{ font-family:'Anton', sans-serif; font-size:26px; color:var(--lime); }
.stat-card .stat-label{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; color:rgba(241,239,233,0.6); margin-top:4px; }.review-card{ background:#151417; border:2px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
.review-card{ background:#151417; border:2px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }

.review-stars{ color:var(--lime); font-size:16px; letter-spacing:2px; }
.review-comment{ margin-top:8px; font-size:14px; line-height:1.4; }
.review-media{ max-width:100%; border-radius:10px; margin-top:10px; display:block; }
.review-actions{ display:flex; gap:8px; margin-top:12px; }
.review-actions button{ flex:1; padding:8px; font-size:11px; }


  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .card{ background:#151417; border:2px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card.delivered{ opacity:0.5; }
  .row-between{ display:flex; justify-content:space-between; align-items:center; }
  .muted{ color:rgba(241,239,233,0.55); font-size:12px; }
  .status-badge{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; padding:3px 10px; border-radius:12px; }
  .status-badge.pending{ background:var(--pink); color:var(--ink); }
  .status-badge.paid{ background:#00E5FF; color:var(--ink); }
  .status-badge.delivered{ background:var(--lime); color:var(--ink); }

  .product-card{ display:flex; gap:12px; }
  .product-card img{ width:60px; height:70px; object-fit:cover; border-radius:8px; flex-shrink:0; background:#000; }
  .product-card .pinfo{ flex:1; }
  .product-card .pname{ font-weight:700; font-size:14px; }
  .product-card .pmeta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--lime); margin-top:2px; }
  .product-actions{ display:flex; gap:8px; margin-top:10px; }
  .product-actions button{ flex:1; padding:8px; font-size:11px; }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .empty{ text-align:center; color:rgba(241,239,233,0.5); padding:30px 0; }
  .faq-edit-item{ margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line); }
</style>
</head>
<body>

<div class="login-box" id="login-box">
  <h1>BROLY75 Admin</h1>
  <input type="password" id="admin-key-input" placeholder="Mot de passe admin">
  <button onclick="login()" style="width:100%;">Se connecter</button>
</div>

<div id="app">
<div class="top-bar">
  <h1 style="margin:0;">BROLY75 — Gestion</h1>
  <button class="logout-btn" onclick="logout()">Déconnexion</button>
</div>


  <div class="
<button class="tab-btn" onclick="switchTab('apercu', this)">Aperçu</button>
<button class="tab-btn" onclick="switchTab('avis', this)">Avis</button>

<button class="tab-btn active" onclick="switchTab('commandes', this)">Commandes</button>
    <button class="tab-btn" onclick="switchTab('produits', this)">Produits</button>
    <button class="tab-btn" onclick="switchTab('contenu', this)">Contenu</button>
  </div>

<!-- ONGLET APERÇU -->
<div class="tab-panel" id="tab-apercu">
  <h2>Aperçu des ventes</h2>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total ventes (€)</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-count">—</div><div class="stat-label">Commandes</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-pending">—</div><div class="stat-label">En attente</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-delivered">—</div><div class="stat-label">Livrées</div></div>
  </div>
  <canvas id="sales-chart" height="200"></canvas>
</div><!-- ONGLET AVIS -->
<div class="tab-panel" id="tab-avis">
  <h2>Avis en attente</h2>
  <div id="reviews-pending-container"></div>
  <h2 style="margin-top:24px;">Avis publiés</h2>
  <div id="reviews-published-container"></div>
</div>

<!-- ONGLET COMMANDES -->
  <div class="tab-panel active" id="tab-commandes">
    <div class="row-between" style="margin-bottom:14px;">
      <h2 style="margin:0;">Commandes</h2>
      <button class="secondary" onclick="loadOrders()">Actualiser</button>
    </div>
    <div id="orders-container"></div>
  </div>

  <!-- ONGLET PRODUITS -->
  <div class="tab-panel" id="tab-produits">
    <div class="row-between" style="margin-bottom:14px;">
      <h2 style="margin:0;">Produits</h2>
      <button onclick="openProductForm()">+ Ajouter</button>
    </div>
    <div id="products-container"></div>

    <!-- Formulaire produit (ajout/édition) -->
    <div class="card" id="product-form" style="display:none;">
      <h2 id="pf-title">Nouveau produit</h2>
      <input type="hidden" id="pf-id">
      <label>Nom</label>
      <input id="pf-name" placeholder="Veste en toile brute">
      <div class="form-grid">
        <div><label>Prix (€)</label><input id="pf-price" type="number"></div>
        <div><label>Catégorie</label><input id="pf-cat" placeholder="Vestes"></div>
      </div>
      <label>Tag (NEW, DROP, HOT, LIMITED...)</label>
      <input id="pf-tag">
      <label>Photo</label>
<input type="file" id="pf-img-file" accept="image/*" onchange="uploadPhoto(this)">
<input type="hidden" id="pf-img">
<img id="pf-img-preview" src="" style="max-width:120px; border-radius:8px; margin:8px 0; display:none;">
<div class="muted" id="pf-img-status"></div>

      <label>Description</label>
      <textarea id="pf-desc" rows="3"></textarea>
      <label>Matière</label>
      <input id="pf-material">
      <div class="form-grid">
        <div><label>Couleurs (séparées par virgule)</label><input id="pf-colors" placeholder="Noir, Kaki, Beige"></div>
        <div><label>Tailles (séparées par virgule)</label><input id="pf-sizes" placeholder="S, M, L, XL"></div>
      </div>
      <label>Stock</label>
      <input id="pf-stock" placeholder="En stock">
      <label>Marque</label>
      <input id="pf-brand" placeholder="BROLY75">
      <div class="product-actions">
        <button onclick="saveProduct()">Enregistrer</button>
        <button class="secondary" onclick="closeProductForm()">Annuler</button>
      </div>
    </div>
  </div>

  <!-- ONGLET CONTENU -->
  <div class="tab-panel" id="tab-contenu">
    <h2>Papier peint</h2>
    <label>URL de l'image de fond (laisse vide pour garder le décor par défaut)</label>
    <input id="c-wallpaper" placeholder="https://...">

    <h2 style="margin-top:20px;">Horaires de livraison</h2>
    <div class="form-grid">
      <div><label>Lundi – Mardi</label><input id="c-lunmar"></div>
      <div><label>Mercredi – Jeudi</label><input id="c-merjeu"></div>
      <div><label>Vendredi</label><input id="c-ven"></div>
      <div><label>Week-end</label><input id="c-weekend"></div>
    </div>

    <h2 style="margin-top:20px;">Meetup</h2>
    <label>Lieu</label>
    <input id="c-meetup-location">
    <label>Horaires</label>
    <input id="c-meetup-hours">

    <h2 style="margin-top:20px;">Service d'envoi</h2>
    <label>Montant minimum</label>
    <input id="c-shipping-min">

    <h2 style="margin-top:20px;">Questions fréquentes</h2>
    <div id="faq-editor"></div>

    <h2 style="margin-top:20px;">Réseaux & contacts</h2>
    <label>Telegram principal (lien)</label>
    <input id="c-tg-main">
    <label>Canal Telegram (lien)</label>
    <input id="c-tg-channel">
    <label>Instagram (lien)</label>
    <input id="c-instagram">
    <label>Snapchat (lien)</label>
    <input id="c-snapchat">
    <label>WhatsApp (lien)</label>
    <input id="c-whatsapp">
    <label>Signal (lien)</label>
    <input id="c-signal">
    <label>Potato (lien)</label>
    <input id="c-potato">

    <button onclick="saveContent()" style="width:100%; margin-top:10px;">Enregistrer le contenu</button>
    <div class="muted" id="content-status" style="text-align:center; margin-top:8px;"></div>
  </div>
</div>

<script>
// ⚠️ Doit correspondre exactement à l'URL de ton backend Railway
const BACKEND_URL = 'https://broly75-backend-production.up.railway.app';
let adminKey = '';
let allProducts = [];

function login(){
  adminKey = document.getElementById('admin-key-input').value;
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadOrders();
  loadStats();

  loadProducts();
  loadContent();
}function logout() {
  adminKey = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
  document.getElementById('admin-key-input').value = '';
}
 

function switchTab(name, btn){
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
if (name === 'apercu') loadStats();
}

// ===== COMMANDES =====
async function loadOrders(){
  const container = document.getElementById('orders-container');
  container.innerHTML = '<p class="empty">Chargement...</p>';
  try {
    const res = await fetch(`${BACKEND_URL}/api/orders`, { headers: { 'x-admin-key': adminKey } });
    if (res.status === 401){ alert('Mot de passe incorrect'); location.reload(); return; }
    const orders = await res.json();
    if (orders.length === 0){ container.innerHTML = '<p class="empty">Aucune commande pour le moment.</p>'; return; }
    container.innerHTML = orders.map(o => `
      <div class="card ${o.status === 'delivered' ? 'delivered' : ''}">
        <div class="row-between"><span class="muted">${o.id}</span><span class="muted">${new Date(o.createdAt).toLocaleString('fr-FR')}</span></div>
        <div style="font-weight:700; margin-top:6px;">${o.name || 'Sans nom'}</div>
        <div class="muted">${(o.lines || []).join(', ')}</div>
        <div class="muted">Total : ${o.totalEur} € — ${o.fulfillment || 'livraison'}</div>
        <div class="muted">${o.address || ''}</div>
        <div class="muted">${o.contact || ''}</div>
        <span class="status-badge ${o.status}">${o.status}</span>
        ${o.status !== 'delivered' ? `<button style="width:100%; margin-top:10px;" onclick="markDelivered('${o.id}')">Marquer comme livrée (+10 coins)</button>` : ''}
      </div>
    `).join('');
  } catch (err) { container.innerHTML = '<p class="empty">Erreur de chargement.</p>'; }
}
let salesChart = null;

async function loadStats(){
  try {
    const res = await fetch(`${BACKEND_URL}/api/orders`, { headers: { 'x-admin-key': adminKey } });
    const orders = await res.json();

    const total = orders.reduce((sum, o) => sum + (o.totalEur || 0), 0);
    const pending = orders.filter(o => o.status === 'pending' || o.status === 'paid').length;
    const delivered = orders.filter(o => o.status === 'delivered').length;

    document.getElementById('stat-total').textContent = total.toFixed(0) + ' €';
    document.getElementById('stat-count').textContent = orders.length;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-delivered').textContent = delivered;

    const sorted = [...orders].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    const labels = sorted.map(o => new Date(o.createdAt).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' }));
    const data = sorted.map(o => o.totalEur || 0);

    const ctx = document.getElementById('sales-chart');
    if (salesChart) salesChart.destroy();
    salesChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Ventes (€)',
          data,
          borderColor: '#D4FF3D',
          backgroundColor: 'rgba(212,255,61,0.15)',
          fill: true,
          tension: 0.3,
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#F1EFE9' } },
          y: { ticks: { color: '#F1EFE9' } }
        }
      }
    });
  } catch (err) {
    console.error('Erreur stats', err);
  }}
  async function loadReviews(){
  const pendingC = document.getElementById('reviews-pending-container');
  const publishedC = document.getElementById('reviews-published-container');
  pendingC.innerHTML = '<p class="empty">Chargement...</p>';
  publishedC.innerHTML = '';
  try {
    const res = await fetch(`${BACKEND_URL}/api/reviews/admin`, { headers: { 'x-admin-key': adminKey } });
    const reviews = await res.json();
    const pending = reviews.filter(r => r.status === 'pending');
    const published = reviews.filter(r => r.status === 'published');

    pendingC.innerHTML = pending.length === 0 ? '<p class="empty">Aucun avis en attente.</p>' : pending.map(r => `
      <div class="review-card">
        <div class="row-between">
          <span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
          <span class="muted">${r.authorName}</span>
        </div>
        <div class="review-comment">${r.comment}</div>
        ${r.mediaUrl ? `<img class="review-media" src="${r.mediaUrl}">` : ''}
        <div class="review-actions">
          <button onclick="updateReview('${r.id}','published')">Publier</button>
          <button class="danger" onclick="updateReview('${r.id}','rejected')">Rejeter</button>
        </div>
      </div>
    `).join('');

    publishedC.innerHTML = published.length === 0 ? '<p class="empty">Aucun avis publié.</p>' : published.map(r => `
      <div class="review-card">
        <div class="row-between">
          <span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
          <span class="muted">${r.authorName}</span>
        </div>
        <div class="review-comment">${r.comment}</div>
        ${r.mediaUrl ? `<img class="review-media" src="${r.mediaUrl}">` : ''}
        <div class="review-actions">
          <button class="danger" onclick="deleteReview('${r.id}')">Dépublier / Supprimer</button>
        </div>
      </div>
    `).join('');
  } catch (err) {
    pendingC.innerHTML = '<p class="empty">Erreur de chargement.</p>';
  }
}

async function updateReview(id, status){
  await fetch(`${BACKEND_URL}/api/reviews/${id}`, {
    method: 'PUT', headers: { 'Content-Type':'application/json', 'x-admin-key': adminKey },
    body: JSON.stringify({ status }),
  });
  loadReviews();
}

async function deleteReview(id){
  if (!confirm('Supprimer cet avis ?')) return;
  await fetch(`${BACKEND_URL}/api/reviews/${id}`, { method:'DELETE', headers:{ 'x-admin-key': adminKey } });
  loadReviews();
}

async function markDelivered(orderId){
  await fetch(`${BACKEND_URL}/api/order/${orderId}/delivered`, { method:'PUT', headers:{ 'x-admin-key': adminKey } });
  loadOrders();
}


function openProductForm(){
  document.getElementById('pf-title').textContent = 'Nouveau produit';
  ['pf-id','pf-name','pf-price','pf-cat','pf-tag','pf-img','pf-desc','pf-material','pf-colors','pf-sizes','pf-stock','pf-brand']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('product-form').style.display = 'block';
  document.getElementById('product-form').scrollIntoView({behavior:'smooth'});
}
function closeProductForm(){ document.getElementById('product-form').style.display = 'none'; }

function editProduct(id){
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  document.getElementById('pf-title').textContent = 'Modifier — ' + p.name;
  document.getElementById('pf-id').value = p.id;
  document.getElementById('pf-name').value = p.name || '';
  document.getElementById('pf-price').value = p.price_eur || p.price || '';
  document.getElementById('pf-cat').value = p.cat || '';
  document.getElementById('pf-tag').value = p.tag || '';
document.getElementById('pf-img').value = p.img || '';
const preview = document.getElementById('pf-img-preview');
preview.src = p.img || '';
preview.style.display = p.img ? 'block' : 'none';

  document.getElementById('pf-desc').value = p.desc || '';
  document.getElementById('pf-material').value = p.material || '';
  document.getElementById('pf-colors').value = (p.colors || []).join(', ');
  document.getElementById('pf-sizes').value = (p.sizes || []).join(', ');
  document.getElementById('pf-stock').value = p.stock || '';
  document.getElementById('pf-brand').value = p.brand || '';
  document.getElementById('product-form').style.display = 'block';
  document.getElementById('product-form').scrollIntoView({behavior:'smooth'});
}
async function uploadPhoto(input){
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('pf-img-status');
  status.textContent = 'Envoi en cours...';
  const formData = new FormData();
  formData.append('photo', file);
  try {
    const res = await fetch(`${BACKEND_URL}/api/upload`, {
      method: 'POST',
      headers: { 'x-admin-key': adminKey },
      body: formData,
    });
    const data = await res.json();
    if (!res.ok) { status.textContent = '❌ ' + (data.error || 'Erreur upload'); return; }
    document.getElementById('pf-img').value = data.url;
    const preview = document.getElementById('pf-img-preview');
    preview.src = data.url;
    preview.style.display = 'block';
    status.textContent = '✅ Photo envoyée';
  } catch (err) {
    status.textContent = '❌ Erreur réseau';
  }
}


async function saveProduct(){
  const id = document.getElementById('pf-id').value;
  const body = {
    name: document.getElementById('pf-name').value,
    price_eur: Number(document.getElementById('pf-price').value),
    price: Number(document.getElementById('pf-price').value),
    cat: document.getElementById('pf-cat').value,
    tag: document.getElementById('pf-tag').value,
    img: document.getElementById('pf-img').value,
    desc: document.getElementById('pf-desc').value,
    material: document.getElementById('pf-material').value,
    colors: document.getElementById('pf-colors').value.split(',').map(s => s.trim()).filter(Boolean),
    sizes: document.getElementById('pf-sizes').value.split(',').map(s => s.trim()).filter(Boolean),
    stock: document.getElementById('pf-stock').value,
    brand: document.getElementById('pf-brand').value,
  };
  const url = id ? `${BACKEND_URL}/api/products/${id}` : `${BACKEND_URL}/api/products`;
  const method = id ? 'PUT' : 'POST';
  await fetch(url, { method, headers: { 'Content-Type':'application/json', 'x-admin-key': adminKey }, body: JSON.stringify(body) });
  closeProductForm();
  loadProducts();
}

async function deleteProduct(id){
  if (!confirm('Supprimer ce produit ?')) return;
  await fetch(`${BACKEND_URL}/api/products/${id}`, { method:'DELETE', headers:{ 'x-admin-key': adminKey } });
  loadProducts();
}

// ===== CONTENU =====
let currentContent = null;

async function loadContent(){
  const res = await fetch(`${BACKEND_URL}/api/content`);
  currentContent = await res.json();
  const c = currentContent;
  document.getElementById('c-wallpaper').value = c.wallpaperUrl || '';
  document.getElementById('c-lunmar').value = c.hours?.lunMar || '';
  document.getElementById('c-merjeu').value = c.hours?.merJeu || '';
  document.getElementById('c-ven').value = c.hours?.ven || '';
  document.getElementById('c-weekend').value = c.hours?.weekend || '';
  document.getElementById('c-meetup-location').value = c.meetup?.location || '';
  document.getElementById('c-meetup-hours').value = c.meetup?.hoursText || '';
  document.getElementById('c-shipping-min').value = c.shipping?.minOrder || '';
  document.getElementById('c-tg-main').value = c.contacts?.telegramMain || '';
  document.getElementById('c-tg-channel').value = c.contacts?.telegramChannel || '';
  document.getElementById('c-instagram').value = c.contacts?.instagram || '';
  document.getElementById('c-snapchat').value = c.contacts?.snapchat || '';
  document.getElementById('c-whatsapp').value = c.contacts?.whatsapp || '';
  document.getElementById('c-signal').value = c.contacts?.signal || '';
  document.getElementById('c-potato').value = c.contacts?.potato || '';

  document.getElementById('faq-editor').innerHTML = (c.faq || []).map((item, i) => `
    <div class="faq-edit-item">
      <label>Question ${i+1}</label>
      <input id="faq-q-${i}" value="${(item.q||'').replace(/"/g,'&quot;')}">
      <label>Réponse ${i+1}</label>
      <textarea id="faq-a-${i}" rows="2">${item.a||''}</textarea>
    </div>
  `).join('');
}

async function saveContent(){
  const faq = (currentContent.faq || []).map((_, i) => ({
    q: document.getElementById('faq-q-'+i).value,
    a: document.getElementById('faq-a-'+i).value,
  }));
  const body = {
    wallpaperUrl: document.getElementById('c-wallpaper').value,
    hours: {
      lunMar: document.getElementById('c-lunmar').value,
      merJeu: document.getElementById('c-merjeu').value,
      ven: document.getElementById('c-ven').value,
      weekend: document.getElementById('c-weekend').value,
    },
    meetup: {
      location: document.getElementById('c-meetup-location').value,
      available: true,
      hoursText: document.getElementById('c-meetup-hours').value,
    },
    shipping: { minOrder: document.getElementById('c-shipping-min').value },
    faq,
    contacts: {
      telegramMain: document.getElementById('c-tg-main').value,
      telegramChannel: document.getElementById('c-tg-channel').value,
      instagram: document.getElementById('c-instagram').value,
      snapchat: document.getElementById('c-snapchat').value,
      whatsapp: document.getElementById('c-whatsapp').value,
      signal: document.getElementById('c-signal').value,
      potato: document.getElementById('c-potato').value,
    },
  };
  const res = await fetch(`${BACKEND_URL}/api/content`, {
    method:'PUT', headers:{ 'Content-Type':'application/json', 'x-admin-key': adminKey }, body: JSON.stringify(body)
  });
  const status = document.getElementById('content-status');
  status.textContent = res.ok ? '✅ Enregistré' : '❌ Erreur';
  setTimeout(() => status.textContent = '', 2000);
  currentContent = body;
}
</script>
</body>
